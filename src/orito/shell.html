</section>
<section id="page-alarm" class="page" aria-labelledby="alarm-title" hidden><div class="page-heading"><div><span class="chapter">あたらしい朝の、待ち合わせ</span><h1 id="alarm-title">何時に起きよう？</h1></div><span data-icon="sun" class="heading-icon"></span></div><div class="alarm-layout"><div class="alarm-card paper-card"><div class="alarm-top"><span>起きるじかん</span><button id="alarm-toggle" class="switch" role="switch" aria-checked="false" aria-label="アラームを有効にする"><span></span></button></div><label class="time-wrap"><span class="sr-only">アラーム時刻</span><input id="alarm-time" type="time" value="07:00" required></label><div class="alarm-status" id="alarm-status" role="status">アラームはおやすみ中</div><button id="enable-alarm-sound" class="button secondary full" type="button" hidden>この画面で音を有効にする</button><div class="time-divider"></div><label class="volume-label" for="volume"><span data-icon="sound"></span>アラームの音</label><input id="volume" type="range" min="0.35" max="1" step="0.05" value="0.35" aria-label="アラームの音量"><p class="alarm-note">アプリを開いている間に鳴るよ</p></div><div class="morning-card"><img src="assets/landscape-morning.svg" alt="朝日がのぼる紙の丘"><div class="morning-card-copy"><h2>おはようを、<br>ためしてみる。</h2><button id="start-morning" class="button primary full"><span data-icon="sun"></span>朝を体験する<span data-icon="arrow"></span></button></div></div></div><details class="demo-settings"><summary>デモ・体験設定<span data-icon="chevron"></span></summary><div class="settings-content"><fieldset class="event-options"><legend>朝のどうぶつ</legend><label><input type="radio" name="event" value="random" checked>おまかせ</label><label><input type="radio" name="event" value="single">1匹</label><label><input type="radio" name="event" value="multiple">みんな</label></fieldset><button id="reset-experience" class="button secondary"><span data-icon="play"></span>デモを起動する</button></div></details></section>
