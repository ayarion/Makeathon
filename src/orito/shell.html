<div class="app-shell">
<aside class="sidebar">
<a href="#write" class="brand" aria-label="折りGO ホーム"><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M4 12 22 5 40 12 22 39Z" fill="#ca785a"/><path d="m4 12 18 9 18-9M22 21v18M22 5v16" fill="none" stroke="#faf4e8" stroke-width="1.5"/></svg><span>折りGO</span></a>
<div class="sidebar-line"></div>
<nav class="main-nav" aria-label="メインメニュー">
<button data-page="write" class="nav-item active" aria-current="page" aria-label="ホーム"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span class="nav-label">ホーム</span></button>
<button data-page="collection" class="nav-item" aria-label="図鑑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5C8 2 4 3 2 4v16c3-2 7-2 10 0m0-15c4-3 8-2 10-1v16c-3-2-7-2-10 0V5Z"/></svg><span class="nav-label">図鑑</span></button>
<button data-page="alarm" class="nav-item" aria-label="アラーム"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4 2 7m17-3 3 3M6 20l-2 2m14-2 2 2M12 8v5l3 2"/><circle cx="12" cy="13" r="8"/></svg><span class="nav-label">アラーム</span></button></nav>
<div class="sidebar-bottom"><svg viewBox="0 0 160 90" aria-hidden="true"><path d="M10 75Q60 25 130 70M35 78Q70 43 153 82" fill="none" stroke="#c9bea7"/><path d="m78 27 34-17-16 31-12-8-22 10Z" fill="#b3c2ca"/><path d="m78 27 18 14-12-8" fill="#69899b"/></svg><p>あしたを、<br>ひと折り。</p></div>
</aside>
<main id="main" tabindex="-1">
<header class="topbar"><span id="page-eyebrow">夜のしたく</span><button id="topbar-alarm" class="topbar-alarm" type="button" aria-label="アラームの設定を開く"><span data-icon="sun" aria-hidden="true"></span><span class="ta-text"><span class="ta-label" id="ta-label">アラーム</span><span class="ta-time" id="ta-time">--:--</span></span></button></header>
<section id="page-write" class="page active" aria-labelledby="write-title">
<div class="write-layout">
<div class="writing-side"><form id="task-form"><div class="paper-sheet"><div class="sheet-top"><label for="task-text" id="form-title" class="sr-only">やること</label><h1 id="write-title" class="paper-heading">明日やること</h1><span data-icon="pencil" aria-hidden="true"></span></div><textarea id="task-text" maxlength="120" rows="4" placeholder="例：ゴミだし" required aria-describedby="form-error"></textarea><fieldset class="paper-colors"><legend>折り紙のいろ</legend><label class="color-choice" style="--swatch:#DB8F85"><input name="color" type="radio" value="peach" checked><span><i data-icon="check"></i></span><span class="sr-only">ももいろ</span></label><label class="color-choice" style="--swatch:#86ABC5"><input name="color" type="radio" value="blue"><span><i data-icon="check"></i></span><span class="sr-only">みずいろ</span></label><label class="color-choice" style="--swatch:#92B380"><input name="color" type="radio" value="sage"><span><i data-icon="check"></i></span><span class="sr-only">わかばいろ</span></label><label class="color-choice" style="--swatch:#D19A60"><input name="color" type="radio" value="orange"><span><i data-icon="check"></i></span><span class="sr-only">だいだいいろ</span></label><label class="color-choice" style="--swatch:#B18DBF"><input name="color" type="radio" value="purple"><span><i data-icon="check"></i></span><span class="sr-only">むらさきいろ</span></label></fieldset><div class="paper-fold"></div></div><p id="form-error" class="inline-error" role="alert"></p><button id="save-task" class="button primary full" type="submit"><span data-icon="fold"></span><span>折り紙にする</span><span data-icon="arrow"></span></button><button type="button" id="cancel-edit" class="button quiet full" hidden>編集をやめる</button></form><div id="saved-feedback" class="saved-feedback" role="status" aria-live="polite"></div></div>
</div>
<section class="task-section" aria-labelledby="tasks-title"><div class="section-heading"><h2 id="tasks-title">タスク折り紙</h2><span id="task-count" class="count-tag">0 まい</span></div><div id="task-list"></div></section>
</section>
<section id="page-alarm" class="page" aria-labelledby="alarm-title" hidden><button class="page-back icon-button" aria-label="アラームを閉じる"><span data-icon="close"></span></button><h1 id="alarm-title" class="sr-only">アラーム</h1><div class="alarm-layout"><div class="alarm-card paper-card"><div class="alarm-top"><span>起きる時間</span></div><div class="alarm-time-row"><label class="time-wrap"><span class="sr-only">アラーム時刻</span><input id="alarm-time" type="time" value="07:00" required></label><button id="alarm-toggle" class="switch" role="switch" aria-checked="false" aria-label="アラームを有効にする"><span></span></button></div><div class="alarm-status" id="alarm-status" role="status"></div><div class="time-divider"></div><label class="volume-label" for="volume"><span data-icon="sound"></span>アラームの音</label><input id="volume" type="range" min="0.35" max="1" step="0.05" value="0.35" aria-label="アラームの音量"></div><div class="morning-card"><img src="assets/landscape-morning.svg" alt="朝日がのぼる紙の丘"><div class="morning-card-copy"><button id="start-morning" class="button primary full"><span data-icon="sun"></span>実際のアラーム画面を体験する<span data-icon="arrow"></span></button></div></div></div><details class="demo-settings"><summary>デモ・体験設定<span data-icon="chevron"></span></summary><div class="settings-content"><fieldset class="event-options"><legend>朝のどうぶつ</legend><label><input type="radio" name="event" value="random" checked>おまかせ</label><label><input type="radio" name="event" value="single">1匹</label><label><input type="radio" name="event" value="multiple">みんな</label></fieldset><button id="reset-experience" class="button secondary"><span data-icon="play"></span>デモを起動する</button></div></details></section>
<section id="page-collection" class="page" aria-labelledby="collection-title" hidden><div class="page-heading"><div><button class="page-back icon-button" aria-label="ホームに戻る">‹</button><h1 id="collection-title" class="sr-only">図鑑</h1></div><span id="collection-count" class="collection-count">0 匹</span></div><div id="collection-list" class="collection-grid"></div></section>
<section id="page-tasks" class="page" hidden aria-labelledby="archive-title"><button class="page-back icon-button" aria-label="ホームに戻る">‹</button><h1 id="archive-title">タスク折り紙</h1><div id="archive-list" class="task-grid"></div></section></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<dialog id="experience-dialog" class="experience-dialog"><div id="experience-mount"></div></dialog>

<dialog id="note-dialog" class="surface-dialog note-dialog" aria-labelledby="write-title"><button type="button" class="note-close icon-button" aria-label="メモ帳を閉じる"><span data-icon="close"></span></button><div id="note-mount"></div></dialog>
<dialog id="alarm-dialog" class="surface-dialog alarm-dialog" aria-label="アラーム設定"></dialog>
